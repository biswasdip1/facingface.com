# ─── render.yaml ─────────────────────────────────────────────────────────────
# Render.com Blueprint for FacingFace
#
# The attached disk stores user-uploaded media. It must remain attached at
# /var/data for uploads to survive deploys and restarts.

services:
  - type: web
    name: facingface
    runtime: node
    plan: starter
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: facingface-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # Render-native media storage. These settings replace Forge storage for
      # all future photos, videos, audio, documents, avatars, and cover images.
      - key: MEDIA_STORAGE_DRIVER
        value: disk
      - key: MEDIA_STORAGE_PATH
        value: /var/data/media
      - key: MEDIA_PUBLIC_PATH
        value: /media

      # These can remain if other FacingFace functions use the Forge APIs for
      # moderation, maps, or similar services. Production media storage never
      # reads them and never creates /manus-storage URLs.
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false

      # To use S3 or Render-hosted MinIO instead of this disk, set
      # MEDIA_STORAGE_DRIVER=s3 and add all S3_* variables manually in Render.

      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: VITE_OAUTH_PORTAL_URL
        value: https://manus.im
      - key: OWNER_OPEN_ID
        sync: false
      - key: OWNER_NAME
        sync: false
